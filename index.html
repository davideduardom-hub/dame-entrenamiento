<style>
:root{
  --petrol:#0E2027; --petrol-2:#15303A; --petrol-3:#1D3F4B; --line:#27525F;
  --paper:#EEF2F1; --paper-2:#FFFFFF; --paper-line:#D3DCDA;
  --amber:#F2B134; --teal:#3FB8AF; --coral:#D6584A; --violet:#8E7CC3;

  --bg:var(--petrol); --surface:var(--petrol-2); --surface-2:var(--petrol-3);
  --border-solid:#234753;
  --text:#EAF2F1; --text-dim:#9DB4BB; --text-faint:#6E8B94;
  --accent:var(--amber); --ok:var(--teal); --bad:var(--coral);

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#E9EEED; --surface:#FFFFFF; --surface-2:#F4F7F6;
    --border-solid:#D6DFDD; --text:#102027; --text-dim:#51676E; --text-faint:#8599A0;
    --accent:#A9740C;
  }
}
:root[data-theme="light"]{
  --bg:#E9EEED; --surface:#FFFFFF; --surface-2:#F4F7F6;
  --border-solid:#D6DFDD; --text:#102027; --text-dim:#51676E; --text-faint:#8599A0;
  --accent:#A9740C;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- layout ---------- */
#app{max-width:560px;margin:0 auto;padding:0 16px 112px}
.screen{display:none;animation:fade .22s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 0 14px}
header.top h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.03em}
header.top .sub{font-size:13px;color:var(--text-faint)}

.card{background:var(--surface);border:1px solid var(--border-solid);border-radius:14px;padding:16px;margin-bottom:12px}
.card.tight{padding:12px}
.card.hecho{border-color:var(--teal);opacity:.72}
.card h2{margin:0 0 10px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--text-dim);font-size:13.5px}
.faint{color:var(--text-faint);font-size:12.5px}

/* ---------- burn-down de calorías ---------- */
.burn{background:var(--surface);border:1px solid var(--border-solid);border-radius:14px;padding:18px 16px 14px;margin-bottom:12px}
.burn .big{display:flex;align-items:flex-end;gap:10px}
.burn .big b{font-size:52px;font-weight:800;line-height:.9;letter-spacing:-.045em}
.burn .big span{font-size:13px;color:var(--text-dim);padding-bottom:6px}
.track{position:relative;height:30px;margin:14px 0 8px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--teal);border-radius:7px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.track .fill.over{background:var(--coral)}
.track .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--amber)}
.track .lbl{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text);font-weight:600}
.macros{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:4px}
.macro{background:var(--surface-2);border-radius:9px;padding:9px 10px}
.macro i{display:block;font-style:normal;font-size:11.5px;color:var(--text-faint)}
.macro b{font-size:17px;font-weight:700}
.macro .bar{height:4px;border-radius:3px;background:var(--border-solid);margin-top:6px;overflow:hidden}
.macro .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* ---------- bloques del día ---------- */
.blocks{display:flex;flex-direction:column;gap:8px}
.block{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid transparent;border-radius:11px;padding:12px;text-align:left;width:100%}
.block.done{border-color:var(--teal)}
.block .tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--border-solid);display:grid;place-items:center;font-size:14px;color:transparent}
.block.done .tick{background:var(--teal);border-color:var(--teal);color:var(--petrol)}
.block .txt{flex:1;min-width:0}
.block .txt b{display:block;font-size:14.5px;font-weight:600}
.block .txt span{font-size:12.5px;color:var(--text-faint)}
.block .go{flex:none;font-size:12px;color:var(--accent);font-weight:600}

/* ---------- racha ---------- */
.streak{display:flex;gap:14px;align-items:center}
.streak .n{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:13px;height:13px;border-radius:4px;background:var(--surface-2);border:1px solid var(--border-solid)}
.dot.h{background:var(--teal);border-color:var(--teal)}
.dot.p{background:var(--amber);border-color:var(--amber)}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#17222a;font-weight:700;font-size:15px;padding:13px 18px;border-radius:11px;width:100%}
.btn.ghost{background:transparent;border:1px solid var(--border-solid);color:var(--text);font-weight:600}
.btn.ok{background:var(--teal);color:#0d2b2a}
.btn.sm{padding:9px 12px;font-size:13.5px;width:auto;border-radius:9px}
.btn.danger{background:transparent;border:1px solid var(--coral);color:var(--coral)}
.row{display:flex;gap:8px}
.row>*{flex:1}

/* ---------- tabs ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--border-solid);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px);padding-top:6px}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--text-faint);font-size:10.5px;font-weight:600}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}

/* ---------- chips / segmentos ---------- */
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-dim)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--border-solid);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--text-dim);background:var(--surface-2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#17222a;font-weight:700}

/* ---------- formularios ---------- */
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:12.5px;color:var(--text-faint);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--border-solid);border-radius:10px;padding:12px;font-size:16px}
textarea{min-height:70px;resize:vertical}

/* ---------- lista de alimentos ---------- */
.flist{max-height:46vh;overflow:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.fitem{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 8px;border-bottom:1px solid var(--border-solid);width:100%;text-align:left}
.fitem:last-child{border-bottom:0}
.fitem b{font-size:14px;font-weight:600;display:block}
.fitem span{font-size:12px;color:var(--text-faint)}
.fitem em{font-style:normal;font-size:13px;color:var(--accent);font-weight:700;white-space:nowrap}

.meal{margin-bottom:14px}
.meal>h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;font-size:13px;font-weight:700;color:var(--text-dim)}
.meal>h3 em{font-style:normal;color:var(--text);font-size:13px}
.entry{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border-solid);font-size:14px}
.entry:last-child{border-bottom:0}
.entry .k{color:var(--text-dim);font-size:12.5px}

/* ---------- ejercicio ---------- */
.exfig{background:var(--surface-2);border-radius:12px;display:block;width:100%;aspect-ratio:1.25/1}
.exfig .ln{stroke:var(--text);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.exfig .gh{stroke:var(--text-faint);stroke-width:3;opacity:.32;stroke-linecap:round;fill:none}
.exfig .hd{fill:var(--text)}
.exfig .eq{stroke:var(--accent);stroke-width:3.2;fill:none;stroke-linecap:round}
.exfig .fl{stroke:var(--text-faint);stroke-width:1.5;opacity:.5}
.setrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border-solid)}
.setrow:last-child{border-bottom:0}
.setrow .i{width:26px;font-size:12.5px;color:var(--text-faint)}
.setrow input{padding:9px;text-align:center}
.setrow .chk{flex:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--border-solid);display:grid;place-items:center;color:var(--text-faint)}
.setrow .chk.on{background:var(--teal);border-color:var(--teal);color:var(--petrol)}

.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:50;
  background:var(--amber);color:#17222a;font-weight:800;padding:11px 20px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none}
.timer.on{display:block}

/* ---------- gráfico ---------- */
.chart{width:100%;height:170px;display:block}
.chart .grid{stroke:var(--border-solid);stroke-width:1}
.chart .ln{stroke:var(--teal);stroke-width:2.4;fill:none;stroke-linejoin:round}
.chart .ar{fill:var(--teal);opacity:.12}
.chart .pt{fill:var(--teal)}
.chart .tx{fill:var(--text-faint);font-size:9px}
.chart .goal{stroke:var(--amber);stroke-width:1.5;stroke-dasharray:4 4}

/* ---------- sheet modal ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.on{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(5,16,20,.6)}
.sheet .pane{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--surface);
  border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 20px);max-width:560px;margin:0 auto;
  animation:up .25s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(22px);opacity:.6}to{transform:none;opacity:1}}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet .hd b{font-size:17px;font-weight:700}
.sheet .hd button{color:var(--text-faint);font-size:22px;line-height:1;padding:4px 8px}

.flag{display:flex;gap:9px;align-items:flex-start;background:var(--surface);background:color-mix(in srgb,var(--coral) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--coral) 40%,transparent);border-radius:11px;padding:11px 12px;font-size:13px;margin-bottom:12px}
.flag.amber{background:color-mix(in srgb,var(--amber) 12%,transparent);border-color:color-mix(in srgb,var(--amber) 42%,transparent)}
.flag.teal{background:color-mix(in srgb,var(--teal) 12%,transparent);border-color:color-mix(in srgb,var(--teal) 40%,transparent)}

table.kv{width:100%;border-collapse:collapse;font-size:13.5px}
table.kv td{padding:7px 0;border-bottom:1px solid var(--border-solid)}
table.kv td:last-child{text-align:right;font-weight:600}
table.kv tr:last-child td{border-bottom:0}

.hand{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border-solid)}
.hand:last-child{border-bottom:0}
.hand svg{width:52px;height:52px}
.hand b{font-size:14px;display:block}
.hand span{font-size:12.5px;color:var(--text-dim)}
.photo{width:100%;border-radius:11px;display:block;margin-top:8px}
.ph-thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:none}
</style>

function poly(keys,A,B,cls,dur){
  const toS=o=>keys.map(k=>o[k]?o[k].join(','):null).filter(Boolean).join(' ');
  const sa=toS(A), sb=toS(B);
  if(!sa||sa.split(' ').length<2) return '';
  if(!sb||sb.split(' ').length!==sa.split(' ').length) return '<polyline class="'+cls+'" points="'+sa+'"/>';
  return '<polyline class="'+cls+'" points="'+sa+'"><animate attributeName="points" dur="'+dur+'s" repeatCount="indefinite" values="'+sa+';'+sb+';'+sa+'" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/></polyline>';
}
function figure(key,dur){
  const pp=P[key]; if(!pp) return '';
  dur=dur||2.6;
  const A=pp[0],B=pp[1];
  let s='<svg class="exfig" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
  s+=PROP[key]||'';
  if(A.k2) s+=poly(['p','k2','a2'],A,B,'gh',dur);
  if(A.e2) s+=poly(['n','e2','w2'],A,B,'gh',dur);
  s+=poly(['n','p'],A,B,'ln',dur);
  s+=poly(['p','k','a'],A,B,'ln',dur);
  s+=poly(['n','e','w'],A,B,'ln',dur);
  s+='<circle class="hd" cx="'+A.h[0]+'" cy="'+A.h[1]+'" r="6.4"><animate attributeName="cx" dur="'+dur+'s" repeatCount="indefinite" values="'+A.h[0]+';'+B.h[0]+';'+A.h[0]+'"/><animate attributeName="cy" dur="'+dur+'s" repeatCount="indefinite" values="'+A.h[1]+';'+B.h[1]+';'+A.h[1]+'"/></circle>';
  s+='</svg>';
  return s;
}

/* ---------- Plan por objetivos ---------- */
const OBJ=[['grasa','Perder grasa'],['resistencia','Ganar resistencia'],['fuerza','Ganar fuerza'],['movilidad','Moverme sin dolor']];
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function planWeek(){
 const c=S.cfg, o=c.objetivos||['grasa'], gym=c.gym!==false, dias=c.dias||6;
 const res=o.includes('resistencia'), fue=o.includes('fuerza'), mov=o.includes('movilidad');
 const F=gym?['g_inf','g_emp','g_tir']:['c_fue','c_fue2','c_pil'];
 const COND=gym?['c_int','c_res','g_int']:['c_int','c_res','c_fun'];
 let seq=[];
 if(res&&fue){ seq=[F[0],COND[0],F[1],'c_pil',F[2],COND[1],'c_fue']; }
 else if(res){ seq=[F[0],COND[0],F[1],COND[1],F[2],COND[2],'c_pil']; }
 else if(fue){ seq=[F[0],'c_pil',F[1],'c_cam',F[2],'c_fue','c_cam']; }
 else { seq=[F[0],'c_fun',F[1],'c_cam',F[2],'c_pil','c_cam']; }
 if(mov) seq[6]='c_pil';
 seq=seq.slice(0,dias);
 const wk=new Array(7).fill('rec');
 let di=1;
 seq.forEach(s=>{ wk[di%7]=s; di++; });
 return wk.map((s,i)=>({d:DIAS[i],s:s}));
}

function load(){
 try{const r=localStorage.getItem(DB_KEY);if(r){const o=JSON.parse(r);if(o&&o.cfg)return migrate(o);}}catch(e){}

function migrate(o){
 const f=freshState();
 Object.keys(f.cfg).forEach(k=>{if(o.cfg[k]===undefined)o.cfg[k]=f.cfg[k];});
 o.tests=o.tests||{}; o.custom=o.custom||[]; o.favs=o.favs||[]; o.weights=o.weights||f.weights;
 if(o.v!==2){ o.cfg.onboard=false; o.v=2; Object.keys(o.log||{}).forEach(k=>{if(o.log[k])o.log[k].sw=null;}); }

function today(){const d=new Date();return ymd(d);}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseD(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function day(k){k=k||CUR;if(!S.log[k])S.log[k]={food:[],water:0,blocks:{},wo:null};
 const d=S.log[k]; d.food=d.food||[]; d.blocks=d.blocks||{}; d.water=d.water||0; return d;}
let CUR=today();

function totals(k){
 const t={kcal:0,p:0,c:0,f:0,fb:0,azucar:0,alcohol:0,frito:0};
 ((S.log[k]&&S.log[k].food)||[]).forEach(f=>{t.kcal+=f.kcal;t.p+=f.p;t.c+=f.c;t.f+=f.f;t.fb+=(f.fb||0);if(f.flag&&t[f.flag]!==undefined)t[f.flag]++;});
 Object.keys(t).forEach(x=>t[x]=Math.round(t[x]*10)/10);
 return t;
}
function sessionFor(k){
 const d=parseD(k), w=planWeek()[d.getDay()];
 const ov=(S.log[k]&&S.log[k].sw)?S.log[k].sw:null;
 const key=(ov&&SESS[ov])?ov:w.s;
 return {key:key, dia:w.d, swapped:!!ov};
}
function dayStatus(k){
 const l=S.log[k]; if(!l)return 0;
 const woDone=l.wo&&l.wo.fin;
 const minDone=l.blocks&&l.blocks.min;
 const ate=(l.food||[]).length>0;
 if(woDone)return 2; if(minDone)return 2; if(ate)return 1; return 0;
}
function streak(){
 let n=0,d=new Date();
 for(let i=0;i<400;i++){
   const k=ymd(d), st=dayStatus(k);
   if(st===2)n++; else if(i===0&&st<2){/* hoy aún cuenta en progreso */} else break;
   d.setDate(d.getDate()-1);
 }
 return n;
}
function lastWeight(){return S.weights.length?S.weights[S.weights.length-1].w:S.cfg.peso;}

  document.body.appendChild(t);}
 t.textContent=m; t.style.display='block';
 clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',2600);
}

let _AF=null;

function runSearch(){
 const q=(document.getElementById('q').value||'').toLowerCase().trim();
 const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 const AF=allFoods();
 let list=AF.map((f,i)=>({f:f,i:i}));
 if(q) list=list.filter(o=>norm(o.f[0]).includes(norm(q)));
 list=list.slice(0,60);
 document.getElementById('res').innerHTML=list.length?list.map(o=>{
  const f=o.f, i=o.i;
  return '<button class="fitem" onclick="portionSheet('+i+')"><span><b>'+esc(f[0])+'</b><span>'+Math.round(f[2])+' kcal / 100 g · P'+f[3]+' C'+f[4]+' G'+f[5]+'</span></span><em>+</em></button>';
 }).join(''):'<div class="faint" style="padding:16px 8px">Sin resultados. Créalo abajo y queda guardado para siempre.</div>';
}

  '<div class="chips" id="pch">'+ports.map((p,j)=>'<button class="chip'+(j===0?' on':'')+'" onclick="setPort(this,'+p[1]+')">'+esc(p[0])+' · '+p[1]+' g</button>').join('')+'</div>'+

let HC={prot:0,ptipo:'magra',carbo:0,ctipo:'normal',grasa:0,verd:0};
function handSheet(){
 HC={prot:1,ptipo:'magra',carbo:1,ctipo:'normal',grasa:1,verd:1};
 openSheet('<div class="hd"><b>Estimar el plato con tus manos</b><button onclick="closeSheet()">×</button></div>'+

function stepper(label,key,sub){
 return '<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-solid)">'+
  '<div style="flex:none">'+handIcon(key)+'</div>'+

  '<div style="display:flex;align-items:center;gap:10px"><button class="chip" onclick="hcAdd(\''+key+'\',-1)">−</button>'+

  '<button class="chip" onclick="hcAdd(\''+key+'\',1)">+</button></div></div>';

function handIcon(k){
 const col={prot:'var(--coral)',carbo:'var(--amber)',grasa:'var(--violet)',verd:'var(--teal)'}[k];
 const shapes={
  prot:'<rect x="7" y="12" width="26" height="17" rx="5"/>',
  carbo:'<circle cx="20" cy="20" r="11"/>',
  grasa:'<rect x="15" y="8" width="10" height="24" rx="5"/>',
  verd:'<path d="M8 26c3-10 10-14 24-16-2 12-9 18-24 16z"/>'
 };
 return '<svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="'+col+'" stroke-width="2.2">'+shapes[k]+'</svg>';
}
function hcAdd(k,d){HC[k]=Math.max(0,HC[k]+d);drawHand();}
function setT(k,v){HC[k]=v;drawHand();}
function drawHand(){
 const p=HAND.prot[HC.ptipo],c=HAND.carbo[HC.ctipo];
 const kcal=HC.prot*p.k+HC.carbo*c.k+HC.grasa*HAND.grasa.k+HC.verd*HAND.verd.k;
 const pr=HC.prot*p.p+HC.carbo*c.p+HC.verd*HAND.verd.p;
 const cb=HC.prot*p.c+HC.carbo*c.c+HC.verd*HAND.verd.c;
 const gr=HC.prot*p.f+HC.carbo*c.f+HC.grasa*HAND.grasa.f+HC.verd*HAND.verd.f;
 const fbr=HC.carbo*(HC.ctipo==='integral'?6:(HC.ctipo==='frito'?3:1.4))+HC.verd*2.6;
 document.getElementById('hbody').innerHTML=
  stepper('Palmas de proteína','prot','Pollo, pescado, carne, huevo')+
  '<div class="chips" style="margin:8px 0 4px">'+['magra','media','grasa'].map(t=>'<button class="chip'+(HC.ptipo===t?' on':'')+'" onclick="setT(\'ptipo\',\''+t+'\')">'+({magra:'Magra: pollo, pescado',media:'Media: res, cerdo',grasa:'Grasa: frito, con piel'})[t]+'</button>').join('')+'</div>'+
  stepper('Puños de carbohidrato','carbo','Arroz, papa, pasta, pan, verde')+
  '<div class="chips" style="margin:8px 0 4px">'+['normal','integral','frito'].map(t=>'<button class="chip'+(HC.ctipo===t?' on':'')+'" onclick="setT(\'ctipo\',\''+t+'\')">'+({normal:'Normal',integral:'Integral o menestra',frito:'Frito'})[t]+'</button>').join('')+'</div>'+
  stepper('Pulgares de grasa','grasa','Aceite, aguacate, queso, mayonesa')+
  stepper('Puñados de verdura','verd','Ensalada, brócoli, vegetales salteados')+
  '<div class="card tight" style="margin:14px 0 12px"><div style="display:flex;justify-content:space-between;align-items:baseline">'+
  '<b class="num" style="font-size:34px">'+Math.round(kcal)+'</b><span class="muted">kcal estimadas</span></div>'+
  '<div class="muted" style="margin-top:4px">Proteína '+Math.round(pr)+' g · Carbos '+Math.round(cb)+' g · Grasa '+Math.round(gr)+' g</div></div>';
 window._HK={kcal:kcal,p:pr,c:cb,f:gr,fb:fbr};
}
function addHand(){
 const v=window._HK; if(!v||!v.kcal){toast('El plato está vacío');return;}
 const parts=[];if(HC.prot)parts.push(HC.prot+' palma'+(HC.prot>1?'s':''));if(HC.carbo)parts.push(HC.carbo+' puño'+(HC.carbo>1?'s':''));
 if(HC.grasa)parts.push(HC.grasa+' pulgar'+(HC.grasa>1?'es':''));if(HC.verd)parts.push(HC.verd+' puñado'+(HC.verd>1?'s':''));
 addEntry({n:'Plato estimado',m:HMEAL,q:parts.join(' + '),kcal:v.kcal,p:v.p,c:v.c,f:v.f,fb:v.fb,flag:HC.ctipo==='frito'||HC.ptipo==='grasa'?'frito':''});

/* foto del plato (se queda en el teléfono) */
function photoSheet(){
 openSheet('<div class="hd"><b>Foto del plato</b><button onclick="closeSheet()">×</button></div>'+
 '<div class="faint" style="margin-bottom:12px">La foto se guarda solo en este teléfono y se adjunta al registro. Sirve para que al final de la semana veas con tus ojos qué tan grandes fueron tus porciones.</div>'+
 '<input type="file" accept="image/*" capture="environment" id="ph" onchange="loadPhoto(this)" style="width:100%;margin-bottom:12px">'+
 '<div id="phprev"></div>');
}
let PHOTO=null;
function loadPhoto(inp){
 const f=inp.files[0]; if(!f)return;
 const rd=new FileReader();
 rd.onload=e=>{
  const img=new Image();
  img.onload=()=>{
   const m=420,sc=Math.min(1,m/Math.max(img.width,img.height));
   const cv=document.createElement('canvas');cv.width=img.width*sc;cv.height=img.height*sc;
   cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
   PHOTO=cv.toDataURL('image/jpeg',.55);
   document.getElementById('phprev').innerHTML='<img class="photo" src="'+PHOTO+'">'+
    '<button class="btn" style="margin-top:12px" onclick="closeSheet();handSheetWithPhoto()">Estimar porciones de esta foto</button>';
  };
  img.src=e.target.result;
 };
 rd.readAsDataURL(f);
}
function handSheetWithPhoto(){
 handSheet();
 const old=addHand;
 window.addHand=function(){
  const v=window._HK; if(!v||!v.kcal){toast('El plato está vacío');return;}
  const parts=[];if(HC.prot)parts.push(HC.prot+' palma'+(HC.prot>1?'s':''));if(HC.carbo)parts.push(HC.carbo+' puño'+(HC.carbo>1?'s':''));
  if(HC.grasa)parts.push(HC.grasa+' pulgar'+(HC.grasa>1?'es':''));if(HC.verd)parts.push(HC.verd+' puñado'+(HC.verd>1?'s':''));
  addEntry({n:'Plato estimado',m:HMEAL,q:parts.join(' + '),kcal:v.kcal,p:v.p,c:v.c,f:v.f,fb:v.fb,flag:'',ph:PHOTO});
  PHOTO=null; window.addHand=old;
 };
}

 if(!l.wo||l.wo.sid!==sf.key) l.wo={sid:sf.key,sets:{},ini:null,fin:null,rondas:0};

 if(circ){

/* ---- circuito por intervalos ---- */
let CIRC=null;
function startCircuit(key){
 const s=SESS[key], l=day(CUR);
 const seq=[{t:'prep',s:10,n:'Prepárate',ex:s.ex[0]}];
 const desde=l.wo.rondas||0;
 for(let r=desde;r<s.rondas;r++){
  s.ex.forEach((id,i)=>{
   seq.push({t:'work',s:s.trabajo,n:EX[id].n,ex:id,r:r+1});
   if(i<s.ex.length-1) seq.push({t:'rest',s:s.descanso,n:'Descanso',ex:s.ex[i+1],r:r+1});
  });
  if(r<s.rondas-1) seq.push({t:'pausa',s:s.pausa,n:'Fin de ronda '+(r+1),ex:s.ex[0],r:r+1});
 }
 CIRC={seq:seq,i:0,left:seq[0].s,key:key,pause:false,ronda:desde};
 openSheet('<div class="hd"><b id="cRound">Ronda '+(desde+1)+' de '+s.rondas+'</b><button onclick="stopCircuit()">×</button></div>'+
  '<div id="cFigBox" style="max-width:220px;margin:0 auto 10px"></div>'+
  '<div style="text-align:center"><div id="cPhase" class="faint"></div>'+
  '<div id="cTime" class="num" style="font-size:66px;font-weight:800;line-height:1;letter-spacing:-.05em;margin:4px 0"></div>'+
  '<div id="cName" style="font-size:17px;font-weight:700;margin-bottom:4px"></div>'+
  '<div id="cHint" class="muted" style="min-height:40px"></div></div>'+
  '<div class="row" style="margin-top:14px"><button class="btn ghost" id="cPause" onclick="pauseCircuit()">Pausar</button>'+
  '<button class="btn ghost" onclick="skipCircuit()">Saltar</button></div>');
 paintCircuit(); tickCircuit();
 clearInterval(CIRC.t);
 CIRC.t=setInterval(()=>{ if(CIRC&&!CIRC.pause){CIRC.left--; tickCircuit();} },1000);
}
function paintCircuit(){
 const st=CIRC.seq[CIRC.i], s=SESS[CIRC.key], e=EX[st.ex];
 document.getElementById('cFigBox').innerHTML=figure(e.f,st.t==='work'?2.0:3.2);
 document.getElementById('cPhase').textContent=st.t==='work'?'Trabaja':(st.t==='rest'?'Descansa, viene:':(st.t==='pausa'?'Pausa larga, viene:':'Empieza con:'));
 document.getElementById('cName').textContent=st.t==='work'?e.n:e.n;
 document.getElementById('cHint').textContent=st.t==='work'?e.t:'Respira hondo por la nariz. Bajar las pulsaciones ahora es lo que te deja llegar entero a la última ronda.';
 if(st.r){CIRC.ronda=st.r;document.getElementById('cRound').textContent='Ronda '+st.r+' de '+s.rondas;}
 document.getElementById('cTime').style.color=st.t==='work'?'var(--text)':'var(--teal)';
}
function tickCircuit(){
 if(!CIRC)return;
 if(CIRC.left<=0){
  const prev=CIRC.seq[CIRC.i];
  if(prev.t==='pausa'||(prev.t==='work'&&CIRC.i===CIRC.seq.length-1)){
   const l=day(CUR); l.wo.rondas=Math.max(l.wo.rondas||0,prev.r||0); save();
  }
  CIRC.i++;
  if(CIRC.i>=CIRC.seq.length){ finishCircuit(); return; }
  CIRC.left=CIRC.seq[CIRC.i].s;
  paintCircuit();
  try{navigator.vibrate&&navigator.vibrate(CIRC.seq[CIRC.i].t==='work'?[180,70,180]:[90]);}catch(e){}
 }
 const t=document.getElementById('cTime');
 if(t)t.textContent=Math.floor(CIRC.left/60)+':'+String(Math.max(0,CIRC.left)%60).padStart(2,'0');
}
function pauseCircuit(){CIRC.pause=!CIRC.pause;document.getElementById('cPause').textContent=CIRC.pause?'Seguir':'Pausar';}
function skipCircuit(){CIRC.left=0;tickCircuit();}
function stopCircuit(){
 if(CIRC){clearInterval(CIRC.t);const l=day(CUR);l.wo.rondas=Math.max(l.wo.rondas||0,Math.max(0,CIRC.ronda-1));save();}
 CIRC=null;closeSheet();rEntreno();
}
function finishCircuit(){
 const s=SESS[CIRC.key], l=day(CUR);
 clearInterval(CIRC.t); l.wo.rondas=s.rondas; CIRC=null;
 s.ex.forEach(id=>{ if(l.wo.sets[id]) l.wo.sets[id][0].d=true; });
 save(); closeSheet(); finish();
 try{navigator.vibrate&&navigator.vibrate([200,100,200,100,300]);}catch(e){}
}

function chart(w,goal){
 if(w.length<2)return '<div class="muted">Registra al menos dos pesos para ver la tendencia.</div>';
 const W=320,H=150,pad=26;
 const ws=w.map(x=>x.w), mn=Math.min(...ws,goal)-1, mx=Math.max(...ws)+1;
 const X=i=>pad+ (i/(w.length-1))*(W-pad-10);
 const Y=v=>H-20-((v-mn)/(mx-mn))*(H-36);
 const pts=w.map((x,i)=>X(i)+','+Y(x.w)).join(' ');
 const area='M'+X(0)+','+(H-20)+' L'+w.map((x,i)=>X(i)+','+Y(x.w)).join(' L')+' L'+X(w.length-1)+','+(H-20)+' Z';
 let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
 s+='<line class="grid" x1="'+pad+'" y1="'+(H-20)+'" x2="'+W+'" y2="'+(H-20)+'"/>';
 if(goal>=mn&&goal<=mx)s+='<line class="goal" x1="'+pad+'" y1="'+Y(goal)+'" x2="'+W+'" y2="'+Y(goal)+'"/>';
 s+='<path class="ar" d="'+area+'"/><polyline class="ln" points="'+pts+'"/>';
 w.forEach((x,i)=>{s+='<circle class="pt" cx="'+X(i)+'" cy="'+Y(x.w)+'" r="2.6"/>';});
 s+='<text class="tx" x="2" y="'+(Y(mx)+4)+'">'+mx.toFixed(0)+'</text><text class="tx" x="2" y="'+(Y(mn)+4)+'">'+mn.toFixed(0)+'</text>';
 s+='<text class="tx" x="'+pad+'" y="'+(H-6)+'">'+w[0].d.slice(5)+'</text><text class="tx" x="'+(W-34)+'" y="'+(H-6)+'">'+w[w.length-1].d.slice(5)+'</text>';
 s+='</svg>';
 return s;
}

function tdee(){
 const c=S.cfg, w=lastWeight();
 const bmr=10*w+6.25*c.altura-5*c.edad+5;
 const af=c.dias<=3?1.22:(c.dias<=5?1.27:1.31);
 return Math.round(bmr*af);
}
function recalc(){
 const c=S.cfg;
 c.edad=+document.getElementById('aE').value||c.edad;
 c.altura=+document.getElementById('aH').value||c.altura;
 const w=+document.getElementById('aW').value||lastWeight();
 c.objetivo=+document.getElementById('aO').value||c.objetivo;
 c.dias=+document.getElementById('aD').value; c.ritmo=document.getElementById('aR').value;
 c.peso=w;
 const t=tdee();
 const cut={suave:.15,moderado:.22,firme:.28}[c.ritmo];
 c.kcal=Math.max(1600,Math.round((t*(1-cut))/10)*10);
 c.nivelProt=document.getElementById('aN')?document.getElementById('aN').value:c.nivelProt;
 c.prot=protPorNivel(c.nivelProt);
 c.fibra=Math.min(40,Math.max(28,Math.round(14*c.kcal/1000)));
 c.gras=Math.max(50,Math.round(0.8*c.objetivo/5)*5);
 c.carb=Math.max(60,Math.round((c.kcal-c.prot*4-c.gras*9)/4/5)*5);
 save(); closeSheet(); render();
 toast('Objetivo: '+c.kcal+' kcal, '+c.prot+' g de proteína');
}

function masaMagra(){
 const lb=lastWith('bf');
 if(lb&&lb.bf!=null) return lb.w*(1-lb.bf/100);
 return lastWeight()*0.63;
}

               ['optimo',2.3,'Óptimo','El techo útil. Por encima de aquí no hay ganancia, solo más gasto.']];
function protPorNivel(nv){
 const f=(NIVELES.find(x=>x[0]===nv)||NIVELES[1])[1];
 return Math.round(f*masaMagra()/5)*5;
}

const PRESETS=[['16:8','12:00','20:00','Ocho horas para comer. El más usado y el más sostenible.'],

function hhmm(s){const p=(s||'12:00').split(':');return (+p[0])*60+(+p[1]);}
function fmtMin(m){const h=Math.floor(m/60),x=m%60;return h?(h+' h '+(x?x+' min':'')).trim():x+' min';}
function ventana(){
 const a=S.cfg.ayuno; if(!a||!a.activo)return null;
 const now=new Date(), m=now.getHours()*60+now.getMinutes();
 const i=hhmm(a.inicio), f=hhmm(a.fin);
 const abierta=(i<=f)?(m>=i&&m<f):(m>=i||m<f);
 let falta;
 if(abierta) falta=(f-m+1440)%1440;
 else falta=(i-m+1440)%1440;
 const total=((f-i)+1440)%1440;
 return {abierta:abierta,falta:falta,total:total,i:i,f:f,ayuno:1440-total};
}

  '<div class="faint" style="margin-top:9px">'+(v.abierta

function restoreSheet(){
 openSheet('<div class="hd"><b>Pegar un respaldo</b><button onclick="closeSheet()">×</button></div>'+
 '<div class="muted" style="margin-bottom:10px">Si guardaste una copia de seguridad antes, pégala aquí y vuelve todo: pesos, comidas, entrenamientos y racha.</div>'+
 '<textarea id="imp" style="min-height:150px;font-size:11px"></textarea>'+
 '<button class="btn" style="margin-top:12px" onclick="doImport()">Restaurar</button>');
}
function storageVivo(){
 try{localStorage.setItem('plandm_t','1');const r=localStorage.getItem('plandm_t')==='1';localStorage.removeItem('plandm_t');return r;}
 catch(e){return false;}
}

/* ---------- Medicación y suplementos ---------- */
function medsSheet(){
 const l=day(CUR), m=l.meds||(l.meds={}), ms=S.cfg.meds||[];
 openSheet('<div class="hd"><b>Medicación y suplementos</b><button onclick="closeSheet()">×</button></div>'+
 '<div id="medlist">'+ms.map((x,i)=>
  '<button class="block'+(m[i]?' done':'')+'" style="margin-bottom:8px" onclick="togMed('+i+')">'+
  '<span class="tick">✓</span><span class="txt"><b>'+esc(x)+'</b></span></button>').join('')+'</div>'+
 '<button class="btn ghost sm" style="width:100%;margin:4px 0 14px" onclick="editMeds()">Editar la lista</button>'+
 '<div class="flag amber"><span>!</span><div><b>Dolor muscular</b><br>Algunos medicamentos para el colesterol pueden dar dolor, calambres o debilidad muscular, y empezar a entrenar de golpe lo hace más probable. Aprender a distinguirlo de las agujetas normales importa: las agujetas aparecen 1 o 2 días después, duelen solo donde entrenaste y se van solas. Ese tipo de dolor suele ser simétrico, en muslos y hombros, y no se va. Si te pasa, avísale a tu médico antes de dejar de tomarla por tu cuenta.</div></div>'+
 '<button class="btn ghost" onclick="flagPain()">'+((l.pain)?'Hoy marqué dolor muscular inusual':'Marcar dolor muscular inusual hoy')+'</button>'+
 '<div class="faint" style="margin-top:12px">Añade aquí tus medicamentos y suplementos para marcarlos cada día. Esta lista es solo un recordatorio: las dosis y los horarios los decide tu médico.</div>');
}
function togMed(i){const l=day(CUR);l.meds=l.meds||{};l.meds[i]=!l.meds[i];save();medsSheet();render();}
function flagPain(){const l=day(CUR);l.pain=!l.pain;save();medsSheet();toast(l.pain?'Anotado. Si se repite varios días, llévalo a consulta.':'Quitado');}
function editMeds(){
 openSheet('<div class="hd"><b>Tu lista</b><button onclick="medsSheet()">×</button></div>'+
 '<label class="f"><span>Uno por línea</span><textarea id="mList" style="min-height:140px">'+esc((S.cfg.meds||[]).join('\n'))+'</textarea></label>'+
 '<button class="btn" onclick="saveMeds()">Guardar lista</button>');
}
function saveMeds(){
 S.cfg.meds=document.getElementById('mList').value.split('\n').map(x=>x.trim()).filter(Boolean);
 save();medsSheet();render();
}

/* ---------- Pruebas de condición física ---------- */
const TESTS=[
 {id:'sent60',n:'Sentadillas en 60 segundos',u:'repeticiones',t:'Sentadilla completa a tu máximo ritmo sin perder la forma. Mide resistencia de piernas.'},
 {id:'flex',n:'Flexiones seguidas',u:'repeticiones',t:'Las máximas sin parar, en la variante que uses hoy (pared, rodillas o piso). Anota la variante en tu cabeza y mantenla igual.'},
 {id:'plank',n:'Plancha máxima',u:'segundos',t:'Hasta que la cadera se hunda. Cuando se hunde, se acabó: no cuenta el tiempo feo.'},
 {id:'marcha3',n:'Rodillas altas en 3 minutos',u:'repeticiones',t:'Cuenta cada vez que sube la rodilla derecha. Es tu prueba de resistencia aeróbica sin salir de casa.'}
];
function rTests(){
 let h='<div class="card"><h2>Pruebas de condición</h2>'+
  '<div class="muted" style="margin-bottom:10px">La báscula mide una sola cosa y a veces miente durante semanas. Estas cuatro pruebas miden lo que de verdad quieres: aguantar más. Repítelas el primer domingo de cada mes.</div>';
 TESTS.forEach(t=>{
  const hs=(S.tests&&S.tests[t.id])||[];
  const last=hs.length?hs[hs.length-1]:null, first=hs.length?hs[0]:null;
  const dif=(last&&first&&hs.length>1)?(last.v-first.v):null;
  h+='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border-solid)">'+
   '<div style="min-width:0"><b style="font-size:14px">'+t.n+'</b>'+
   '<div class="faint">'+(last?('Último: '+last.v+' · '+last.d):'Sin registrar')+
   (dif!==null?(' · '+(dif>0?'+':'')+dif+' desde el inicio'):'')+'</div></div>'+
   '<button class="btn sm ghost" onclick="testSheet(\''+t.id+'\')">'+(last?'Repetir':'Medir')+'</button></div>';
 });
 return h+'</div>';
}
function testSheet(id){
 const t=TESTS.find(x=>x.id===id), hs=(S.tests&&S.tests[id])||[];
 openSheet('<div class="hd"><b>'+esc(t.n)+'</b><button onclick="closeSheet()">×</button></div>'+
 '<div class="muted" style="margin-bottom:12px">'+esc(t.t)+'</div>'+
 '<label class="f"><span>Resultado en '+t.u+'</span><input type="number" id="tV" inputmode="numeric"></label>'+
 '<button class="btn" onclick="saveTest(\''+id+'\')">Guardar resultado</button>'+
 (hs.length?'<table class="kv" style="margin-top:16px">'+hs.slice(-6).reverse().map(x=>'<tr><td>'+x.d+'</td><td class="num">'+x.v+'</td></tr>').join('')+'</table>':''));
}
function saveTest(id){
 const v=+document.getElementById('tV').value;
 if(!v){toast('Escribe el resultado');return;}
 S.tests=S.tests||{}; S.tests[id]=S.tests[id]||[];
 S.tests[id].push({d:CUR,v:v}); save(); closeSheet(); render(); toast('Resultado guardado');
}

/* ---------- Onboarding ---------- */
let OB=null;
function rOnboard(){
 const c=S.cfg;
 if(!OB)OB={obj:(c.objetivos||['grasa']).slice(),dias:c.dias,gym:c.gym!==false,impacto:c.impacto||'bajo'};
 let h='<header class="top"><div><h1>Antes de empezar</h1><div class="sub">Seis respuestas y la app arma tu plan</div></div></header>';
 h+='<button class="btn ghost" style="margin-bottom:14px" onclick="restoreSheet()">Ya tengo un respaldo: pegarlo y seguir</button>';
 if(!storageVivo())h+='<div class="flag"><span>!</span><div>Este navegador no está guardando datos entre visitas. Exporta tu respaldo al terminar cada sesión, o aloja la app por tu cuenta para que guarde sola.</div></div>';
 h+='<div class="card"><h2>¿Qué quieres lograr? Puedes elegir varios</h2><div class="chips">'+
  OBJ.map(o=>'<button class="chip'+(OB.obj.includes(o[0])?' on':'')+'" onclick="obTog(\''+o[0]+'\')">'+o[1]+'</button>').join('')+'</div>'+
  '<div class="faint" style="margin-top:9px">'+objHint()+'</div></div>';
 h+='<div class="card"><h2>¿Cuántos días por semana vas a entrenar?</h2><div class="chips">'+
  [3,4,5,6,7].map(d=>'<button class="chip'+(OB.dias===d?' on':'')+'" onclick="OB.dias='+d+';rOnboard()">'+d+' días</button>').join('')+'</div>'+
  '<div class="faint" style="margin-top:9px">Elige el número que vas a cumplir en tu peor semana, no en la mejor.</div></div>';
 h+='<div class="card"><h2>¿Tienes gimnasio a mano?</h2><div class="chips">'+
  [[true,'Sí, el de mi edificio'],[false,'No, solo mi sala']].map(x=>'<button class="chip'+(OB.gym===x[0]?' on':'')+'" onclick="OB.gym='+x[0]+';rOnboard()">'+x[1]+'</button>').join('')+'</div>'+
  '<div class="faint" style="margin-top:9px">Aunque digas que sí, cada día de gimnasio trae su versión equivalente en casa a un toque de distancia.</div></div>';
 h+='<div class="card"><h2>¿Cómo andan tus rodillas y tobillos?</h2><div class="chips">'+
  [['bajo','Mejor sin saltos'],['normal','Aguantan saltos']].map(x=>'<button class="chip'+(OB.impacto===x[0]?' on':'')+'" onclick="OB.impacto=\''+x[0]+'\';rOnboard()">'+x[1]+'</button>').join('')+'</div>'+
  '<div class="faint" style="margin-top:9px">Si llevas tiempo sin entrenar o cargas peso de más, la opción sin saltos es la sensata los primeros dos meses. Todos los ejercicios tienen versión sin impacto.</div></div>';
 h+='<div class="card"><h2>Tus números</h2>'+
  '<div class="row"><label class="f"><span>Edad</span><input type="number" id="oE" value="'+c.edad+'"></label>'+
  '<label class="f"><span>Estatura (cm)</span><input type="number" id="oH" value="'+c.altura+'"></label></div>'+
  '<div class="row"><label class="f"><span>Peso hoy (kg)</span><input type="number" step="0.1" id="oW" value="'+lastWeight()+'"></label>'+
  '<label class="f"><span>Peso objetivo (kg)</span><input type="number" step="0.1" id="oO" value="'+c.objetivo+'"></label></div>'+
  '<label class="f"><span>Ritmo de pérdida</span><select id="oR">'+
   [['suave','Suave: 0.4 kg por semana'],['moderado','Moderado: 0.6 kg por semana'],['firme','Firme: 0.8 kg por semana']]
   .map(x=>'<option value="'+x[0]+'"'+(c.ritmo===x[0]?' selected':'')+'>'+x[1]+'</option>').join('')+'</select></label></div>';
 h+='<div class="card"><h2>¿Tomas algo a diario?</h2>'+
  '<label class="f"><span>Medicamentos y suplementos, uno por línea</span><textarea id="oM" style="min-height:110px">'+esc((c.meds||[]).join('\n'))+'</textarea></label>'+
  '<div class="faint">Aparecen cada día como un bloque para marcar. La app no sabe de dosis ni las cambia: solo te recuerda.</div></div>';
 h+='<button class="btn" onclick="finishOnboard()">Crear mi plan</button>';
 h+='<div class="faint" style="margin-top:12px;text-align:center">Puedes cambiar todo esto después en Ajustes.</div>';
 document.getElementById('scr-hoy').innerHTML=h;
}
function objHint(){
 const o=OB.obj;
 if(o.includes('resistencia')&&o.includes('fuerza'))return 'Fuerza y resistencia a la vez: tres días de fuerza y dos de acondicionamiento, separados para que no se estorben.';
 if(o.includes('resistencia'))return 'Con resistencia dentro, el plan mete circuitos por intervalos y sesiones continuas, no solo caminata.';
 if(o.includes('fuerza'))return 'Prioridad a la carga progresiva: menos circuitos, más series pesadas y descansos largos.';
 if(o.includes('movilidad'))return 'Se añade un día de pilates y movilidad al final de la semana.';
 return 'Solo perder grasa: fuerza para no perder músculo y cardio suave para sumar gasto.';
}
function obTog(k){
 const i=OB.obj.indexOf(k);
 if(i>=0){ if(OB.obj.length>1)OB.obj.splice(i,1); } else OB.obj.push(k);
 rOnboard();
}
function finishOnboard(){
 const c=S.cfg;
 c.objetivos=OB.obj.slice(); c.dias=OB.dias; c.gym=OB.gym; c.impacto=OB.impacto;
 c.edad=+document.getElementById('oE').value||c.edad;
 c.altura=+document.getElementById('oH').value||c.altura;
 c.objetivo=+document.getElementById('oO').value||c.objetivo;
 c.ritmo=document.getElementById('oR').value;
 c.meds=document.getElementById('oM').value.split('\n').map(x=>x.trim()).filter(Boolean);
 const w=+document.getElementById('oW').value||lastWeight();
 if(w&&Math.abs(w-lastWeight())>0.05){S.weights=S.weights.filter(x=>x.d!==CUR);S.weights.push({d:CUR,w:w,bf:null});S.weights.sort((a,b)=>a.d<b.d?-1:1);}
 c.peso=w; c.onboard=true;
 const t=tdee(), cut={suave:.15,moderado:.22,firme:.28}[c.ritmo];
 c.kcal=Math.max(1600,Math.round((t*(1-cut))/10)*10);
 c.prot=Math.round(1.8*c.objetivo/5)*5;
 const maxC=2.2*c.objetivo, altC=(c.kcal-c.prot*4-0.6*c.objetivo*9)/4;
 c.carb=Math.max(60,Math.round(Math.min(maxC,altC)/5)*5);
 c.gras=Math.max(35,Math.round((c.kcal-c.prot*4-c.carb*4)/9/5)*5);
 OB=null; save(); render();
 toast('Plan creado: '+c.kcal+' kcal y '+c.dias+' días de entreno');
}
function rPlanCard(){
 const wk=planWeek();
 return '<div class="card"><h2>Tu semana</h2>'+
  wk.map((d,i)=>{const s=SESS[d.s];
   return '<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-solid)">'+
   '<span class="muted">'+d.d+'</span><span style="text-align:right;font-size:13.5px;font-weight:600">'+esc(s.t)+
   '<span class="faint" style="font-weight:400"> · '+(s.loc==='gym'?'gym':'casa')+'</span></span></div>';}).join('')+
  '<div class="faint" style="margin-top:10px">Generada desde tus objetivos: '+(S.cfg.objetivos||[]).map(o=>(OBJ.find(x=>x[0]===o)||['','?'])[1].toLowerCase()).join(' y ')+'.</div></div>';
}

/* ---------- 12. Arranque ---------- */
(function init(){
 const th=localStorage.getItem('plandm_theme'); if(th)document.documentElement.setAttribute('data-theme',th);
 drawTabs(); render();
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){const t=today();if(t!==CUR&&CUR===ymd(new Date(Date.now()-864e5))){}CUR=today();render();}});
})();

</script>
